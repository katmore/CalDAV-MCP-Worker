# Checks weekly whether Cloudflare has changed the starter files this project copies
# (see vendor/cloudflare-starter). If they have, it opens an issue, or comments on the
# open one, so the change can be reviewed. If the check itself breaks, the run fails and
# GitHub emails a failure notice instead.
name: Watch Cloudflare starter

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays, 09:00 UTC
  workflow_dispatch: # run on demand from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Compare with upstream
        id: verify
        run: |
          set +e
          node scripts/vendor.mjs verify 2>&1 | tee verify.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case $status in
            0) echo "Upstream unchanged." ;;
            3) echo "Upstream has changed; an issue will be opened or updated." ;;
            *) echo "::error::The upstream check failed; see the log above."; exit 1 ;;
          esac

      - name: Open or update the issue
        if: steps.verify.outputs.status == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Cloudflare starter files changed upstream'
          source=vendor/cloudflare-starter/SOURCE.json
          repo=$(node -p "require('./$source').repository")
          path=$(node -p "require('./$source').path")
          commit=$(node -p "require('./$source').commit")
          branch=$(node -p "require('./$source').branch")
          {
            echo "Cloudflare has changed files this project copied from \`$repo\` at \`${commit:0:7}\`:"
            echo
            grep 'has changed on' verify.log | sed -E 's/^✖ [^:]+: ([^ ]+) has changed.*/- `\1`/'
            echo
            echo "- [Recent changes to \`$path\`](https://github.com/$repo/commits/$branch/$path)"
            echo "- [Full comparison](https://github.com/$repo/compare/$commit...$branch)"
            echo
            echo "To review and take the changes, see Copied starter code in VALIDATION.md."
            echo "Close this issue once the change has been reviewed."
          } > body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
