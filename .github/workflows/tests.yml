# Runs the type check and the full test suite on every push and pull request. npm test
# also fails if coverage of src/ drops below 100% or the copied Cloudflare code changes
# without a recorded patch.
#
# On pushes to main it also turns the coverage report into the number on the README's
# coverage badge: the test job produces badge.json from the report, and a separate job with
# no access to the code publishes only that file to the `badges` branch. The Tests badge is
# GitHub's own status for this workflow.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - name: Make the coverage badge file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/coverage-badge.mjs coverage/coverage-summary.json coverage/badge.json
      - name: Keep it for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage/badge.json
          if-no-files-found: error

  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to push the badges branch
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch badges "$remote" out 2>/dev/null; then :; else
            git init --quiet out
            git -C out checkout --quiet --orphan badges
            git -C out remote add origin "$remote"
          fi
          cp badge.json out/coverage.json
          cd out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage.json
          if git diff --cached --quiet; then echo 'Badge unchanged.'; exit 0; fi
          git commit --quiet -m "Coverage badge for ${GITHUB_SHA}"
          git push --quiet origin badges
