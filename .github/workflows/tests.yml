# Runs the type check and the full test suite on every push and pull request. npm test
# also fails if coverage of src/ drops below 100% or the copied Cloudflare code changes
# without a recorded patch.
#
# The coverage report from that run is uploaded to Codecov, which serves the README's
# coverage badge. The Tests badge is GitHub's own status for this workflow.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the upload to Codecov authenticate as this workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false # a Codecov outage should not fail the build
