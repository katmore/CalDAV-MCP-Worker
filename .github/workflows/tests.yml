# Runs the type check and the full test suite on every push and pull request. npm test
# also fails if coverage of src/ drops below 100% or the copied Cloudflare code changes
# without a recorded patch.
#
# The coverage report from that run is uploaded to Codecov, which serves the README's
# coverage badge. The Tests badge is GitHub's own status for this workflow.
#
# On pushes to main the same run refreshes the generated parts of README.md and
# VALIDATION.md (`npm run docs`, see dev/README.md). The test job writes them and hands them
# on; a separate job with no dependencies installed commits any change as github-actions[bot].
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the upload to Codecov authenticate as this workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false # a Codecov outage should not fail the build
      - name: Refresh the generated docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run docs
      - name: Keep them for the commit job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-docs
          path: |
            README.md
            VALIDATION.md
          if-no-files-found: error

  docs:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to commit the generated docs
    concurrency:
      group: docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-docs
      - name: Commit any change
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md VALIDATION.md; then echo 'Generated docs are up to date.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md VALIDATION.md
          git commit --quiet -m 'Refresh the generated docs [skip ci]'
          git push --quiet
